name: Verify and deploy coursework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coursework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out the current project
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Fetch the anonymous table for research verification
        run: git lfs pull --include='data/processed/all_records.csv.gz' --exclude=''
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install locked browser checks
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npm run browser:install --prefix tests
      - name: Verify course deliverables and documentation links
        run: python3 scripts/system/check_coursework.py
      - name: Build and verify the entrance, presentation, atlas and research
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/check_presentation.py
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursework-validation
          path: |
            artifacts/qa/zhiwei-gate/
            artifacts/qa/zhiwei/
            artifacts/qa/defense/
          if-no-files-found: ignore
      - name: Check whether this repository has enabled Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          coursework_pages_enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          echo "enabled=$coursework_pages_enabled" >> "$GITHUB_OUTPUT"
      - name: Upload the verified website
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.pages_enabled == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@v4
